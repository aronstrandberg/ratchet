[global]
line-length = 80
# docs/direction.md is a copy of a document, kept as it was written.
exclude = ["tools/oxlint/anti-slop/**", ".agents/**", "docs/direction.md"]
# Keep the exclusion when a hook passes file names.
force-exclude = true

[MD013]
reflow = true
reflow-mode = "normalize"
tables = false
code-blocks = false
